# Локальная разработка:  docker compose up -d db      (только база)
# Сервер / всё в Docker: docker compose up -d --build  (база + приложение на :3000)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      # Порт на хосте; поменяй DB_PORT в .env, если 5432 уже занят.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://dashboard:dashboard@db:5432/dashboard
    ports:
      - '3300:3300'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
