# Release: push a tag like v0.2.0 → desktop installers for Windows, macOS and Linux attached to a
# GitHub Release. The Docker image (tags 0.2.0 and latest) is built by image.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NX_NO_CLOUD: true

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      # Install scripts are allowed only for electron (see allowScripts in package.json).
      - run: npm ci

      - run: npx nx build desktop

      # Version of the app = version from the tag (v0.2.0 → 0.2.0). Builds are not code-signed.
      - name: Package
        shell: bash
        run: >
          npx electron-builder --config apps/desktop/electron-builder.yml --publish never
          -c.extraMetadata.version=${GITHUB_REF_NAME#v}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop-installers/*.exe
            dist/desktop-installers/*.dmg
            dist/desktop-installers/*.AppImage
          if-no-files-found: error

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installers/*
