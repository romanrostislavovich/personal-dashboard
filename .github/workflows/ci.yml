name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # nx-set-shas looks up the last successful run on main to find what changed.
  actions: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
      # Database tests (e.g. sync between two databases) create scratch databases next to this one.
      TEST_DATABASE_URL: postgres://dashboard:dashboard@localhost:5432/dashboard
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      # --ignore-scripts: the Electron binary is not needed for checks.
      - run: npm ci --ignore-scripts

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint test build

      # Migrations must match the schemas: if someone changed *.schema.ts
      # and forgot `npm run db:generate`, drizzle-kit creates a new file and the check fails.
      - name: Check migrations are up to date
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code --quiet -- apps/api/migrations && test -z "$(git status --porcelain apps/api/migrations)"
