# The server: the dashboard behind Caddy (automatic HTTPS) with daily database backups.
# Setup and updates: docs/deploy.md. Everything is configured in .env next to this file.

# Docker keeps container logs forever by default; a small server would fill its disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: dashboard
    # No published port: only the app and the backup job reach the database.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard']
      interval: 5s
      retries: 10
    <<: *logging

  app:
    # deploy.sh sets IMAGE to the image it built and uploaded; otherwise the one from GHCR.
    image: ${IMAGE:-ghcr.io/romanrostislavovich/personal-dashboard:main}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://dashboard:${DB_PASSWORD}@db:5432/dashboard
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      API_PORT: 3300
      # The dumps of the backup job: watched, reported on and handed to the sync client.
      BACKUP_DIR: /backups
      # The hourly report of security-scan.sh about the server itself, for the security agent.
      SECURITY_DIR: /security
      # The desktop installers deploy.sh puts there, for Settings → Apps (GitHub without them).
      DESKTOP_INSTALLERS_PATH: /downloads/desktop
      # The Android app deploy.sh puts there (deploy/mobile-apk.Dockerfile).
      MOBILE_APK_PATH: /downloads/mobile
      # The VPN's devices for its container, and its status back (DEPLOY_VPN=yes; empty — none).
      VPN_DIR: ${VPN_DIR:-}
    volumes:
      - ./backups:/backups:ro
      - ./security:/security:ro
      - ./downloads:/downloads:ro
      - ./vpn-data:/vpn
    depends_on:
      db:
        condition: service_healthy
    <<: *logging

  # Spelling and grammar (ru, uk, en, pl and more), on this server: the texts never leave it.
  # Java's memory is capped. 768 MB ran out four times in three days (Java heap space, with the
  # languages it keeps for auto-detection loaded): a gigabyte, still without n-gram data.
  languagetool:
    image: erikvl87/languagetool:6.8
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g
    # No published port: only the app asks it.
    <<: *logging

  # Local models on this server, optional: `COMPOSE_PROFILES=ollama` in .env switches it on.
  # It pulls OLLAMA_MODELS on start (by default the model of search by meaning, 562 MB) and keeps
  # one model in memory at a time, within OLLAMA_MEMORY. No published port: only the app asks
  # it — in Settings → AI, a connection to http://ollama:11434/v1. A chat model good enough for
  # light work (qwen2.5:7b, see `npm run ai:eval`) needs a server with 8 GB of memory.
  ollama:
    image: ollama/ollama:0.40.6
    profiles: ['ollama']
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 5m
      MODELS: ${OLLAMA_MODELS:-paraphrase-multilingual}
    entrypoint:
      - sh
      - -c
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for model in $$MODELS; do ollama pull "$$model"; done
        wait
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY:-1g}
    <<: *logging

  # The owner's own VPN, optional: `COMPOSE_PROFILES=vpn` (deploy.sh with DEPLOY_VPN=yes) switches
  # it on. AmneziaWG — WireGuard that a DPI does not recognise — in userspace; the dashboard
  # writes its devices into ./vpn-data and reads its status back (libs/modules/vpn). On a network
  # of its own: a device in the tunnel never reaches the database or the other containers.
  vpn:
    build: ./vpn
    image: personal-dashboard-vpn:local
    profiles: ['vpn']
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - '${VPN_PORT:-37853}:${VPN_PORT:-37853}/udp'
      # A second door, UDP 443 — the port of QUIC, which a provider's shaper leaves alone, while
      # an unknown UDP port got 35 of 450 Mbit/s (DEPLOY_VPN_UDP443; otherwise loopback only).
      - '${VPN_UDP443:-127.0.0.1:37443}:${VPN_PORT:-37853}/udp'
    volumes:
      - ./vpn-data:/vpn
    networks:
      - vpn
    <<: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3. Given to the VPN with DEPLOY_VPN_UDP443: then only on this server's own loopback.
      - '${CADDY_UDP_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_PROTOCOLS: ${CADDY_PROTOCOLS:-h1 h2 h3}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: keep them, or Let's Encrypt rate limits may bite after a few restarts.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    <<: *logging

  # A dump of the database once a day, the last BACKUP_KEEP_DAYS days are kept in ./backups;
  # once a week the dump is test-restored into a scratch database. Your computer (the sync
  # client) downloads the newest dump every day — that is the off-site copy.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: dashboard
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: dashboard
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      db:
        condition: service_healthy
    <<: *logging

networks:
  # The VPN's own: the services above without `networks` stay on the default one.
  vpn:

volumes:
  db-data:
  caddy-data:
  caddy-config:
  ollama-data:
