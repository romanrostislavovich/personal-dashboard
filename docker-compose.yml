# Local development:     docker compose up -d db      (database only)
# Server / all in Docker: docker compose up -d --build  (database + app on :3000)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      # Host port; change DB_PORT in .env if 5432 is already taken. Only this computer can
      # reach it: the password above is the well-known one of local development.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://dashboard:dashboard@db:5432/dashboard
      # A sync client keeps copies of the server's daily dumps here (docs/deploy.md, "Backups").
      BACKUP_COPY_DIR: /backups
    volumes:
      - ./backups:/backups
    ports:
      - '3300:3300'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
