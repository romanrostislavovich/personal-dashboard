<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Скриншот — Personal Dashboard</title>
    <style>
      :root {
        --bar: #f3f1f8;
        --text: #1b1b1f;
        --muted: #5d5e66;
        --accent: #3f51b5;
        --line: #c6c5d0;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bar: #2a292f;
          --text: #e4e1e9;
          --muted: #c6c5d0;
          --accent: #bac3ff;
          --line: #46464f;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e22;
        font:
          13px system-ui,
          'Segoe UI',
          sans-serif;
        color: var(--text);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 6px 8px;
        background: var(--bar);
        border-bottom: 1px solid var(--line);
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 32px;
        height: 32px;
        padding: 0 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      button.on {
        background: color-mix(in srgb, var(--accent) 26%, transparent);
      }
      button.primary {
        background: var(--accent);
        color: var(--bar);
        font-weight: 600;
      }
      .sep {
        width: 1px;
        height: 22px;
        margin: 0 4px;
        background: var(--line);
      }
      .swatch {
        min-width: 22px;
        width: 22px;
        height: 22px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .swatch.on {
        border-color: var(--text);
      }
      .spacer {
        flex: 1;
      }
      #stage {
        flex: 1;
        overflow: auto;
        display: grid;
        place-items: center;
        padding: 12px;
      }
      #canvas {
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        cursor: crosshair;
        max-width: 100%;
      }
      #text {
        position: fixed;
        display: none;
        min-width: 40px;
        padding: 2px 4px;
        border: 1px dashed var(--accent);
        outline: none;
        background: rgba(255, 255, 255, 0.85);
        font-weight: 600;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button data-tool="arrow" title="Стрелка (A)">➚</button>
      <button data-tool="rect" title="Рамка (R)">▭</button>
      <button data-tool="ellipse" title="Овал (O)">◯</button>
      <button data-tool="line" title="Линия (L)">╱</button>
      <button data-tool="marker" title="Маркер (M)">🖍</button>
      <button data-tool="pen" title="Карандаш (P)">✎</button>
      <button data-tool="text" title="Текст (T)">T</button>
      <button data-tool="number" title="Номер (N)">①</button>
      <button data-tool="blur" title="Скрыть: размыть область (B)">▦</button>
      <span class="sep"></span>
      <span id="swatches"></span>
      <span class="sep"></span>
      <button data-width="2" title="Тонко">─</button>
      <button data-width="4" title="Средне">━</button>
      <button data-width="8" title="Толсто">▬</button>
      <span class="sep"></span>
      <button id="undo" title="Отменить (Ctrl+Z)">↶</button>
      <button id="redo" title="Повторить (Ctrl+Y)">↷</button>
      <span class="spacer"></span>
      <button id="cancel" title="Esc">Отмена</button>
      <button id="copy" title="Ctrl+C">Копировать</button>
      <button id="actions" title="Сохранить и выбрать, что с ним сделать: задача, дневник…">
        Сохранить и…
      </button>
      <button id="save" class="primary" title="Ctrl+S">Сохранить</button>
    </div>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div id="text" contenteditable="true"></div>
    <script>
      // The editor of a screenshot: shapes drawn over the picture, kept as a list (so they can be
      // undone), painted onto a canvas of the picture's own size; the PNG goes back to the app.
      const COLOURS = ['#e53935', '#fdd835', '#43a047', '#1e88e5', '#212121', '#ffffff'];
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const textBox = document.getElementById('text');
      const base = new Image();
      const state = { tool: 'arrow', colour: COLOURS[0], width: 4 };
      let shapes = [];
      let undone = [];
      let drawing = null;
      let busy = false;

      window.desktop.annotate.image().then((url) => {
        if (!url) return window.desktop.annotate.cancel();
        base.onload = () => {
          canvas.width = base.naturalWidth;
          canvas.height = base.naturalHeight;
          // Sharp on a screen with scaling: shown at its size in CSS pixels.
          canvas.style.width = base.naturalWidth / devicePixelRatio + 'px';
          render();
        };
        base.src = url;
      });

      // --- The toolbar ---

      const swatches = document.getElementById('swatches');
      for (const colour of COLOURS) {
        const swatch = document.createElement('button');
        swatch.className = 'swatch';
        swatch.style.background = colour;
        swatch.dataset.colour = colour;
        swatch.title = colour;
        swatches.append(swatch);
      }
      document.getElementById('bar').addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.tool) state.tool = button.dataset.tool;
        if (button.dataset.colour) state.colour = button.dataset.colour;
        if (button.dataset.width) state.width = Number(button.dataset.width);
        markChosen();
      });
      function markChosen() {
        document
          .querySelectorAll('[data-tool]')
          .forEach((b) => b.classList.toggle('on', b.dataset.tool === state.tool));
        document
          .querySelectorAll('[data-colour]')
          .forEach((b) => b.classList.toggle('on', b.dataset.colour === state.colour));
        document
          .querySelectorAll('[data-width]')
          .forEach((b) => b.classList.toggle('on', Number(b.dataset.width) === state.width));
      }
      markChosen();

      document.getElementById('undo').onclick = undo;
      document.getElementById('redo').onclick = redo;
      document.getElementById('cancel').onclick = () => window.desktop.annotate.cancel();
      document.getElementById('copy').onclick = () => finish('copy');
      document.getElementById('save').onclick = () => finish('save');
      document.getElementById('actions').onclick = () => finish('actions');

      document.addEventListener('keydown', (event) => {
        if (textBox.style.display === 'block') return;
        const key = event.key.toLowerCase();
        if (event.ctrlKey && key === 'z') return (event.preventDefault(), undo());
        if (event.ctrlKey && key === 'y') return (event.preventDefault(), redo());
        if (event.ctrlKey && key === 's') return (event.preventDefault(), finish('save'));
        if (event.ctrlKey && key === 'c') return (event.preventDefault(), finish('copy'));
        if (key === 'escape') return window.desktop.annotate.cancel();
        const tools = {
          a: 'arrow',
          r: 'rect',
          o: 'ellipse',
          l: 'line',
          m: 'marker',
          p: 'pen',
          t: 'text',
          n: 'number',
          b: 'blur',
        };
        if (!event.ctrlKey && tools[key]) {
          state.tool = tools[key];
          markChosen();
        }
      });

      // --- Drawing ---

      /** A point of the picture under the mouse (the canvas is shown smaller than it is). */
      function point(event) {
        const box = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - box.left) * canvas.width) / box.width,
          y: ((event.clientY - box.top) * canvas.height) / box.height,
        };
      }
      /** The thickness in the picture's pixels: the same on the screen whatever its scaling. */
      const thickness = () => state.width * devicePixelRatio;

      canvas.addEventListener('mousedown', (event) => {
        if (event.button !== 0) return;
        const at = point(event);
        if (state.tool === 'text') {
          // The mouse would take the focus back to the canvas: the box gets it now, so nothing
          // typed right after the click is lost.
          event.preventDefault();
          return startText(event, at);
        }
        if (state.tool === 'number') {
          const number = shapes.filter((shape) => shape.tool === 'number').length + 1;
          return add({ tool: 'number', colour: state.colour, width: thickness(), at, number });
        }
        drawing = {
          tool: state.tool,
          colour: state.colour,
          width: thickness(),
          from: at,
          to: at,
          points: [at],
        };
      });
      window.addEventListener('mousemove', (event) => {
        if (!drawing) return;
        const at = point(event);
        drawing.to = at;
        if (drawing.tool === 'pen' || drawing.tool === 'marker') drawing.points.push(at);
        render(drawing);
      });
      window.addEventListener('mouseup', () => {
        if (!drawing) return;
        const shape = drawing;
        drawing = null;
        const size = Math.hypot(shape.to.x - shape.from.x, shape.to.y - shape.from.y);
        if (size > 3 || shape.points.length > 2) add(shape);
        else render();
      });

      function add(shape) {
        shapes.push(shape);
        undone = [];
        render();
      }
      function undo() {
        if (shapes.length) undone.push(shapes.pop());
        render();
      }
      function redo() {
        if (undone.length) shapes.push(undone.pop());
        render();
      }

      // --- Text: typed in place, a shape once Enter is pressed ---

      function startText(event, at) {
        Object.assign(textBox.style, {
          display: 'block',
          left: event.clientX + 'px',
          top: event.clientY - 12 + 'px',
          color: state.colour,
          fontSize: 8 + state.width * 3 + 'px',
        });
        textBox.textContent = '';
        textBox.dataset.x = at.x;
        textBox.dataset.y = at.y;
        textBox.focus();
      }
      textBox.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          textBox.blur();
        } else if (event.key === 'Escape') {
          textBox.textContent = '';
          textBox.blur();
        }
      });
      textBox.addEventListener('blur', () => {
        const text = textBox.textContent.trim();
        textBox.style.display = 'none';
        if (text) {
          add({
            tool: 'text',
            colour: state.colour,
            size: (8 + state.width * 3) * devicePixelRatio,
            at: { x: Number(textBox.dataset.x), y: Number(textBox.dataset.y) },
            text,
          });
        }
      });

      // --- Painting ---

      function render(extra) {
        if (!base.naturalWidth) return;
        ctx.drawImage(base, 0, 0);
        for (const shape of extra ? [...shapes, extra] : shapes) paint(shape);
      }

      function paint(shape) {
        ctx.save();
        ctx.strokeStyle = ctx.fillStyle = shape.colour;
        ctx.lineWidth = shape.width;
        ctx.lineCap = ctx.lineJoin = 'round';
        const { from, to } = shape;
        switch (shape.tool) {
          case 'arrow':
            arrow(from, to, shape.width);
            break;
          case 'line':
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();
            break;
          case 'rect':
            ctx.strokeRect(from.x, from.y, to.x - from.x, to.y - from.y);
            break;
          case 'ellipse':
            ctx.beginPath();
            ctx.ellipse(
              (from.x + to.x) / 2,
              (from.y + to.y) / 2,
              Math.abs(to.x - from.x) / 2,
              Math.abs(to.y - from.y) / 2,
              0,
              0,
              Math.PI * 2,
            );
            ctx.stroke();
            break;
          case 'pen':
          case 'marker':
            if (shape.tool === 'marker') {
              ctx.globalAlpha = 0.4;
              ctx.lineWidth = shape.width * 4;
              ctx.lineCap = 'square';
            }
            ctx.beginPath();
            shape.points.forEach((p, index) =>
              index ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y),
            );
            ctx.stroke();
            break;
          case 'text':
            ctx.font = `600 ${shape.size}px system-ui, 'Segoe UI', sans-serif`;
            ctx.textBaseline = 'top';
            // A light outline keeps the words readable on any background.
            ctx.lineWidth = Math.max(2, shape.size / 8);
            ctx.strokeStyle = shape.colour === '#ffffff' ? '#000000' : '#ffffff';
            shape.text.split('\n').forEach((line, index) => {
              ctx.strokeText(line, shape.at.x, shape.at.y + index * shape.size * 1.2);
              ctx.fillText(line, shape.at.x, shape.at.y + index * shape.size * 1.2);
            });
            break;
          case 'number': {
            const radius = 10 * devicePixelRatio + shape.width * 1.5;
            ctx.beginPath();
            ctx.arc(shape.at.x, shape.at.y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle =
              shape.colour === '#ffffff' || shape.colour === '#fdd835' ? '#000000' : '#ffffff';
            ctx.font = `700 ${radius * 1.2}px system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(shape.number), shape.at.x, shape.at.y + radius * 0.05);
            break;
          }
          case 'blur':
            pixelate(from, to);
            break;
        }
        ctx.restore();
      }

      function arrow(from, to, width) {
        const angle = Math.atan2(to.y - from.y, to.x - from.x);
        const head = Math.max(12, width * 4);
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x - Math.cos(angle) * head * 0.6, to.y - Math.sin(angle) * head * 0.6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(to.x, to.y);
        ctx.lineTo(
          to.x - head * Math.cos(angle - Math.PI / 7),
          to.y - head * Math.sin(angle - Math.PI / 7),
        );
        ctx.lineTo(
          to.x - head * Math.cos(angle + Math.PI / 7),
          to.y - head * Math.sin(angle + Math.PI / 7),
        );
        ctx.closePath();
        ctx.fill();
      }

      /** What is under the rectangle becomes big squares: unreadable, not just blurred. */
      function pixelate(from, to) {
        const x = Math.round(Math.min(from.x, to.x));
        const y = Math.round(Math.min(from.y, to.y));
        const w = Math.round(Math.abs(to.x - from.x));
        const h = Math.round(Math.abs(to.y - from.y));
        if (w < 2 || h < 2) return;
        const cell = Math.max(8, Math.round(12 * devicePixelRatio));
        const small = document.createElement('canvas');
        small.width = Math.max(1, Math.ceil(w / cell));
        small.height = Math.max(1, Math.ceil(h / cell));
        small.getContext('2d').drawImage(base, x, y, w, h, 0, 0, small.width, small.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(small, 0, 0, small.width, small.height, x, y, w, h);
      }

      // --- Done ---

      async function finish(action) {
        if (busy || !base.naturalWidth) return;
        busy = true;
        render();
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
        const data = new Uint8Array(await blob.arrayBuffer());
        await window.desktop.annotate.done(data, action);
        busy = false;
      }
    </script>
  </body>
</html>
