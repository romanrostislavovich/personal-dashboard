name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  # nx-set-shas looks up the last successful run on main to find what changed.
  actions: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # --ignore-scripts: the Electron binary is not needed for checks.
      - run: npm ci --ignore-scripts

      - uses: nrwl/nx-set-shas@v5

      # Nx's local cache between runs: a project whose inputs did not change is not linted
      # or built again. Keyed by the commit, restored from the newest one before it.
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run format:check

      - run: npx nx affected -t lint build

      # Migrations must match the schemas: if someone changed *.schema.ts
      # and forgot `npm run db:generate`, drizzle-kit creates a new file and the check fails.
      - name: Check migrations are up to date
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code --quiet -- apps/api/migrations && test -z "$(git status --porcelain apps/api/migrations)"
