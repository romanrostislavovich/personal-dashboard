<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      .mark {
        position: fixed;
        height: 2px;
        border-radius: 1px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <script>
      // A transparent window over the screen that lets every click through: only the marks
      // under the mistakes of the field the user types in (writing/desktop-writing.ts).
      window.desktop.writingOverlay.onMarks((marks) => {
        document.body.replaceChildren(
          ...marks.map(({ x, y, width, colour }) => {
            const mark = document.createElement('div');
            mark.className = 'mark';
            Object.assign(mark.style, {
              left: x + 'px',
              top: y + 'px',
              width: width + 'px',
              background: colour,
            });
            return mark;
          }),
        );
      });
    </script>
  </body>
</html>
