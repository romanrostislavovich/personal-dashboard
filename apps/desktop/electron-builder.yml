# Build an installer: npx nx package desktop  →  dist/desktop-installers
# Releases are built by .github/workflows/release.yml on v* tags.
appId: com.romanrostislavovich.personal-dashboard
productName: Personal Dashboard
# No spaces — easier to download and to link from the README.
artifactName: personal-dashboard-${version}-${os}-${arch}.${ext}
directories:
  app: dist/apps/desktop
  output: dist/desktop-installers
# The shell has no dependencies at run time (apps/desktop/build.mjs bundles its code), so the
# modules of the whole workspace stay out of the installer.
files:
  - '**/*'
  - '!node_modules'
# The icon of the installers is its own large file: macOS wants at least 512 px, while the one
# the app shows at run time (src/assets/icon.png) travels with every update and stays small.
win:
  target: nsis
  icon: apps/desktop/icon.png
mac:
  target: dmg
  icon: apps/desktop/icon.png
linux:
  target: AppImage
  category: Utility
  icon: apps/desktop/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
