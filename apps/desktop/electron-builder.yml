# Build an installer: npx nx package desktop  →  dist/desktop-installers
# Releases are built by .github/workflows/release.yml on v* tags.
appId: com.romanrostislavovich.personal-dashboard
productName: Personal Dashboard
# No spaces — easier to download and to link from the README.
artifactName: personal-dashboard-${version}-${os}-${arch}.${ext}
directories:
  app: dist/apps/desktop
  output: dist/desktop-installers
files:
  - '**/*'
win:
  target: nsis
  icon: apps/desktop/src/assets/icon.png
mac:
  target: dmg
  icon: apps/desktop/src/assets/icon.png
linux:
  target: AppImage
  category: Utility
  icon: apps/desktop/src/assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
