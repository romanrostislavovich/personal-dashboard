# Docker image to ghcr.io/<owner>/personal-dashboard, for amd64 and arm64:
# - every commit to main, once CI has passed on it → tags `main` and `sha-<commit>` (the server
#   follows `main`, see docs/deploy.md): a commit that breaks CI is never published;
# - a tag like v0.2.0 → tags `0.2.0` and `latest`.
name: Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Only after CI succeeded (a tag is published as it is: it is cut from a tested commit).
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # arm64 needs no emulation: the Dockerfile builds on the runner's platform and only copies.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }},enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
